name: Phase 16 MCP interoperability

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control-plane protocol and security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci --no-fund

      - name: Validate formatting
        run: npm run format:check

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Run MCP, OAuth, workspace and security regressions
        run: npm test

      - name: Run local TLS preflight unit tests (no network or secrets)
        run: node --test ../../scripts/interop/verify-local-tls.test.mjs

      - name: Check Cloudflare Worker bundle without deployment
        run: npm run dry-run

      - name: Audit high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

  independent-inspector:
    name: Real Inspector, Gemini, Claude and Codex CLI MCP interoperability (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci --no-fund

      - name: Check external-client harness shell syntax
        run: bash -n ../../scripts/interop/inspector-unauthenticated-smoke.sh

      - name: Run isolated real MCP Inspector CLI without credentials
        run: bash ../../scripts/interop/inspector-unauthenticated-smoke.sh

      - name: Check authenticated Inspector harness shell syntax
        run: bash -n ../../scripts/interop/inspector-authenticated-smoke.sh

      - name: Check real Gemini CLI probe syntax
        run: bash -n ../../scripts/interop/gemini-cli-authenticated-probe.sh

      - name: Check real Claude Code CLI probe syntax
        run: bash -n ../../scripts/interop/claude-code-authenticated-probe.sh

      - name: Validate Codex runtime Python source and Bash wrapper
        run: |
          python3 -m py_compile ../../scripts/interop/codex-app-server-readonly-probe.py
          bash -n ../../scripts/interop/codex-app-server-readonly-probe.sh

      - name: Run signed JWT MCP Inspector, Gemini, Claude and Codex read-only interoperability
        env:
          PHASE16_REAL_GEMINI_CLI: "1"
          PHASE16_REAL_CLAUDE_CODE: "1"
          PHASE16_REAL_CODEX_APP_SERVER: "1"
        run: bash ../../scripts/interop/inspector-authenticated-smoke.sh

      - name: Check synthetic PKCE HTTPS harness shell syntax
        run: bash -n ../../scripts/interop/oauth-pkce-https-smoke.sh

      - name: Run real HTTPS Authorization Code + PKCE S256 protocol smoke
        run: bash ../../scripts/interop/oauth-pkce-https-smoke.sh

  real-keycloak-idp:
    name: Real Keycloak HTTPS issuer and access-token contract (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: apps/control-plane
        run: npm ci --no-fund

      - name: Install isolated Chromium runtime and NSS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3-tools
          cd apps/control-plane
          npm install --no-save --package-lock=false --ignore-scripts --no-fund playwright@1.58.2
          command -v google-chrome
          google-chrome --version

      - name: Validate real-browser and upstream Keycloak harness syntax
        run: |
          bash -n scripts/interop/keycloak-real-idp-contract.sh
          bash -n scripts/interop/keycloak-browser-pkce-mcp-smoke.sh
          node --check apps/control-plane/test/fixtures/keycloak-browser-pkce.mjs
          bash -n scripts/interop/keycloak-inspector-interactive-oauth-smoke.sh
          node --check apps/control-plane/test/fixtures/keycloak-inspector-interactive-oauth.mjs
          node --check apps/control-plane/test/fixtures/keycloak-gemini-issuer-preflight.mjs
          bash -n scripts/interop/keycloak-codex-cli-interactive-oauth-smoke.sh
          node --check apps/control-plane/test/fixtures/keycloak-codex-cli-interactive-oauth.mjs
          python3 -m py_compile scripts/interop/codex-app-server-oauth-readonly.py
          bash -n scripts/interop/keycloak-gemini-cli-native-oauth-smoke.sh
          node --check apps/control-plane/test/fixtures/keycloak-gemini-cli-native-oauth.mjs
          bash -n scripts/interop/keycloak-gemini-cli-repl-oauth-smoke.sh
          node --check apps/control-plane/test/fixtures/keycloak-gemini-cli-repl-oauth.mjs
          bash -n scripts/interop/keycloak-claude-code-native-oauth-smoke.sh
          node --check apps/control-plane/test/fixtures/keycloak-claude-code-native-oauth.mjs
          node --check apps/control-plane/test/fixtures/keycloak-claude-code-oauth-revocation.mjs
          bash -n scripts/interop/keycloak-opencode-v2-native-oauth-smoke.sh
          node --check apps/control-plane/test/fixtures/keycloak-opencode-v2-native-oauth.mjs

      - name: Verify real disposable Keycloak HTTPS OIDC and JWT issuance
        run: bash scripts/interop/keycloak-real-idp-contract.sh
