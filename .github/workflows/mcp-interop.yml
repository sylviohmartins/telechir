name: Phase 16 MCP interoperability

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control-plane protocol and security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci --no-fund

      - name: Validate formatting
        run: npm run format:check

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Run MCP, OAuth, workspace and security regressions
        run: npm test

      - name: Run local TLS preflight unit tests (no network or secrets)
        run: node --test ../../scripts/interop/verify-local-tls.test.mjs

      - name: Check Cloudflare Worker bundle without deployment
        run: npm run dry-run

      - name: Audit high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

  independent-inspector:
    name: Independent Inspector and Gemini CLI interoperability (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci --no-fund

      - name: Check external-client harness shell syntax
        run: bash -n ../../scripts/interop/inspector-unauthenticated-smoke.sh

      - name: Run isolated real MCP Inspector CLI without credentials
        run: bash ../../scripts/interop/inspector-unauthenticated-smoke.sh

      - name: Check authenticated Inspector harness shell syntax
        run: bash -n ../../scripts/interop/inspector-authenticated-smoke.sh

      - name: Check real Gemini CLI probe syntax
        run: bash -n ../../scripts/interop/gemini-cli-authenticated-probe.sh

      - name: Check real Claude Code CLI probe syntax
        run: bash -n ../../scripts/interop/claude-code-authenticated-probe.sh

      - name: Run signed JWT MCP Inspector, Gemini CLI and Claude Code interoperability
        env:
          PHASE16_REAL_GEMINI_CLI: "1"
          PHASE16_REAL_CLAUDE_CODE: "1"
        run: bash ../../scripts/interop/inspector-authenticated-smoke.sh

      - name: Check synthetic PKCE HTTPS harness shell syntax
        run: bash -n ../../scripts/interop/oauth-pkce-https-smoke.sh

      - name: Run real HTTPS Authorization Code + PKCE S256 protocol smoke
        run: bash ../../scripts/interop/oauth-pkce-https-smoke.sh
